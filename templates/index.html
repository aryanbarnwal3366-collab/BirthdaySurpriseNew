<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Ghanishka!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Georgia, 'Times New Roman', serif;
      color: #fff; text-align: center; overflow: hidden;
      background: radial-gradient(circle at top, #7352a8, transparent 48%),
                  linear-gradient(145deg, #241638, #713d78 55%, #d17a9b);
    }
    .card {
      width: min(100%, 560px); padding: 42px 26px; border-radius: 28px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 20px 60px rgba(20, 5, 35, .35); backdrop-filter: blur(10px);
      animation: rise 1s ease both;
    }
    .sparkle { font-size: 30px; letter-spacing: 12px; }
    h1 { font-size: clamp(2.2rem, 8vw, 4rem); margin: 18px 0 10px; }
    .name { color: #ffe3a8; }
    p { font-family: Arial, sans-serif; line-height: 1.7; font-size: 1.05rem; }
    a {
      display: inline-block; margin-top: 20px; padding: 15px 28px;
      border-radius: 999px; background: #ffe4a8; color: #44234f;
      text-decoration: none; font: bold 1rem Arial, sans-serif;
      box-shadow: 0 8px 25px rgba(0,0,0,.2); transition: transform .2s;
    }
    a:hover { transform: translateY(-3px); }
    .float { position: fixed; bottom: -30px; opacity: .7; animation: floatUp 9s linear infinite; }
    .f1 { left: 10%; animation-delay: 0s; } .f2 { left: 80%; animation-delay: 3s; }
    .f3 { left: 55%; animation-delay: 5s; }
    @keyframes floatUp { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="float f1">♡</div><div class="float f2">✦</div><div class="float f3">♡</div>
  <main class="card">
    <div class="sparkle">✦ ♡ ✦</div>
    <h1>Happy Birthday<br><span class="name">Ghanishka!</span></h1>
    <p>A little surprise, made with lots of care.<br>Hope your day is filled with happiness and beautiful moments.</p>
    <a href="/song">Open Your Surprise ✨</a>
  </main>
</body>
</html>
